        <!-- Settings Card -->
        <div class="profile-card">
            <div class="profile-card-header">
                <div class="profile-card-title">
                    <h2>Account settings</h2>
                </div>
                <button class="btn-edit" id="editBtn" onclick="toggleSettingsEdit()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 16 16">
                        <path d="M11.3333 2.00001C11.5084 1.82491 11.716 1.68602 11.9447 1.59126C12.1735 1.4965 12.4188 1.44772 12.6667 1.44772C12.9145 1.44772 13.1598 1.4965 13.3886 1.59126C13.6173 1.68602 13.8249 1.82491 14 2.00001C14.1751 2.17511 14.314 2.38268 14.4088 2.61144C14.5035 2.84019 14.5523 3.08549 14.5523 3.33334C14.5523 3.58119 14.5035 3.82649 14.4088 4.05524C14.314 4.284 14.1751 4.49157 14 4.66667L5 13.6667L1.33333 14.6667L2.33333 11L11.3333 2.00001Z" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Edit</span>
                </button>
            </div>

            <form class="settings-form" id="settingsForm">
                <div class="form-row-grid">
                    <div class="form-group">
                        <label for="status">STATUS</label>
                        <input type="text" id="status" value="active" disabled>
                    </div>
                    <div class="form-group">
                        <label for="membership">MEMBERSHIP LEVEL</label>
                        <input type="text" id="membership" value="Premium" disabled>
                    </div>
                </div>

                <div class="form-row-grid" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label for="password">PASSWORD</label>
                        <input type="text" id="password" value="change password" class="password-link" disabled>
                    </div>
                    <div class="form-group">
                        <label for="twitter">TWITTER</label>
                        <input type="text" id="twitter" value="Subscribed" disabled>
                    </div>
                </div>

                <div class="settings-divider"></div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="profile-footer">
        <p>© 2025 F17. All rights reserved.</p>
    </footer>

    <script>
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'index.html';
            }
        }

        function toggleSettingsEdit() {
            const form = document.getElementById('settingsForm');
            const inputs = form.querySelectorAll('input');
            const editBtn = document.getElementById('editBtn');
            
            const isDisabled = inputs[0].disabled;
            
            inputs.forEach(input => {
                if (input.id !== 'password') {
                    input.disabled = !input.disabled;
                }
            });

            if (isDisabled) {
                editBtn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 16 16"><path d="M11.3333 2.00001C11.5084 1.82491 11.716 1.68602 11.9447 1.59126C12.1735 1.4965 12.4188 1.44772 12.6667 1.44772C12.9145 1.44772 13.1598 1.4965 13.3886 1.59126C13.6173 1.68602 13.8249 1.82491 14 2.00001C14.1751 2.17511 14.314 2.38268 14.4088 2.61144C14.5035 2.84019 14.5523 3.08549 14.5523 3.33334C14.5523 3.58119 14.5035 3.82649 14.4088 4.05524C14.314 4.284 14.1751 4.49157 14 4.66667L5 13.6667L1.33333 14.6667L2.33333 11L11.3333 2.00001Z" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Save</span>';
            } else {
                editBtn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 16 16"><path d="M11.3333 2.00001C11.5084 1.82491 11.716 1.68602 11.9447 1.59126C12.1735 1.4965 12.4188 1.44772 12.6667 1.44772C12.9145 1.44772 13.1598 1.4965 13.3886 1.59126C13.6173 1.68602 13.8249 1.82491 14 2.00001C14.1751 2.17511 14.314 2.38268 14.4088 2.61144C14.5035 2.84019 14.5523 3.08549 14.5523 3.33334C14.5523 3.58119 14.5035 3.82649 14.4088 4.05524C14.314 4.284 14.1751 4.49157 14 4.66667L5 13.6667L1.33333 14.6667L2.33333 11L11.3333 2.00001Z" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Edit</span>';
                alert('Settings saved successfully!');
            }
        }

        // Handle password change link click
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput) {
                passwordInput.addEventListener('click', function() {
                    if (this.disabled && this.value === 'change password') {
                        alert('Password change functionality would open here');
                    }
                });
            }
        });
    </script>
